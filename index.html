 <header>

 <summary>Escala de habitacion</summary>
 <p>
 Haz clic abajo para iniciar. Explora el entorno en 360 grados arrastrando tu dedo en la pantalla del 
celular o con el ratón en la computadora.
 <a class="back" href="./">Back</a>
 </p>

 <script type="module">
 import { WebXRButton } from './js/util/webxr-button.js';
 import { Scene } from './js/render/scenes/scene.js';
 import { Renderer, createWebGLContext } from './js/render/core/renderer.js';
 import { Gltf2Node } from './js/render/nodes/gltf2.js';
 import { SkyboxNode } from './js/render/nodes/skybox.js';
 import { InlineViewerHelper } from './js/util/inline-viewer-helper.js';
 import { QueryArgs } from './js/util/query-args.js';
 import WebXRPolyfill from './js/third-party/webxr-polyfill/build/webxr-polyfill.module.js';
 if (QueryArgs.getBool('usePolyfill', true)) {
 let polyfill = new WebXRPolyfill();
 }
 let xrButton = null;
 let xrSession = null;
 let xrRefSpace = null;
 let inlineViewerHelper = null;
 let gl = null;

### Page 2 ###
 let renderer = null;
 let scene = new Scene();
 scene.addNode(new Gltf2Node({url: 'media/gltf/camp/ciudad.gltf'}));
 scene.addNode(new SkyboxNode({url: 'media/textures/textura.png'}));
 scene.standingStats(true);
 function initXR() {
 xrButton = new WebXRButton({
 onRequestSession: onRequestSession,
 onEndSession: onEndSession,
 textEnterXR: "INICIAR PANORAMA",
 textXRNotFound: "XR NO SOPORTADO",
 textLeaveXR: "SALIR"
 });
 document.querySelector('header').appendChild(xrButton.domElement);
 if (navigator.xr) {
 navigator.xr.isSessionSupported('inline').then((supported) => {
 xrButton.enabled = supported;
 });
 }
 }
 function onRequestSession() {
 // SOLUCIÓN AL FONDO NEGRO: Al pedir una sesión inline, pasamos explícitamente la característica "viewer"
 // Esto le otorga al navegador los permisos internos necesarios para instanciar la cámara en pantalla plana.
 return navigator.xr.requestSession('inline', {
 requiredFeatures: ['viewer']
 }).then(onSessionStarted);
 }
 function onSessionStarted(session) {
 xrSession = session;
 xrButton.setSession(session);
 session.addEventListener('end', onSessionEnded);
 initGL();
 let glLayer = new XRWebGLLayer(session, gl);
 session.updateRenderState({ baseLayer: glLayer });
 // Solicitamos el espacio de referencia básico que permite inicializar el lienzo
 session.requestReferenceSpace('viewer').then((refSpace) => {
 xrRefSpace = refSpace;
 
 // Inicializamos el asistente para poder mover la cámara arrastrando con el dedo o con el ratón
 inlineViewerHelper = new InlineViewerHelper(gl.canvas, refSpace);
 inlineViewerHelper.setHeight(1.6); 
 session.requestAnimationFrame(onXRFrame);
 });
 }

### Page 3 ###
 function initGL() {
 if (gl) return;
 gl = createWebGLContext({ xrCompatible: true });
 document.body.appendChild(gl.canvas);
 onResize();
 window.addEventListener('resize', onResize);
 renderer = new Renderer(gl);
 scene.setRenderer(renderer);
 }
 function onResize() {
 if (!gl) return;
 gl.canvas.width = gl.canvas.clientWidth * window.devicePixelRatio;
 gl.canvas.height = gl.canvas.clientHeight * window.devicePixelRatio;
 }
 function onEndSession(session) {
 session.end();
 }
 function onSessionEnded(event) {
 xrButton.setSession(null);
 xrSession = null;
 }
 function onXRFrame(t, frame) {
 let session = frame.session;
 
 // Consultamos la pose generada a través de las interacciones táctiles/ratón calculadas por el helper
 let refSpace = inlineViewerHelper ? inlineViewerHelper.referenceSpace : xrRefSpace;
 let pose = frame.getViewerPose(refSpace);
 scene.startFrame();
 session.requestAnimationFrame(onXRFrame);
 if (pose) {
 // Renderizamos de manera segura la capa de dibujo
 scene.drawXRFrame(frame, pose);
 }

### Page 4 ###
  // --- CONTROL DEL MANDO ADICIONAL ---
  // Este bloque funciona de forma externa sin tocar la programación de WebXR
  try {
    const gamepads = navigator.getGamepads();
    const mando = gamepads[0]; // Captura el control en el teléfono Samsung

    if (mando && inlineViewerHelper) {
      const zonaMuerta = 0.15;
      const velocidad = 0.02;

      // Movimiento de la rueda a los lados cambia la orientación horizontal (Yaw)
      if (Math.abs(mando.axes[0]) > zonaMuerta) {
        inlineViewerHelper._lookYaw -= mando.axes[0] * velocidad;
      }

      // Movimiento de la rueda arriba/abajo cambia la orientación vertical (Pitch)
      if (Math.abs(mando.axes[1]) > zonaMuerta) {
        inlineViewerHelper._lookPitch -= mando.axes[1] * velocidad;
        
        // Mantener la cámara dentro del límite físico de la mirada para bloquear el Roll
        const limiteMaximo = Math.PI / 2 - 0.05;
        inlineViewerHelper._lookPitch = Math.max(-limiteMaximo, Math.min(limiteMaximo, inlineViewerHelper._lookPitch));
      }
    }
  } catch(e) {}

 scene.endFrame();
 }
 initXR();
 </script>
